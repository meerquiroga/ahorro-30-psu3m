<style>

  #app { max-width: 560px; margin: 0 auto; padding: 18px 16px 80px; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

  .pill { font-size: 12px; padding: 5px 11px; border-radius: 99px; background: var(--tinta); color: #fff; font-weight: 700; white-space: nowrap; }
  .barra { height: 8px; border-radius: 99px; background: var(--linea); overflow: hidden; margin-bottom: 18px; }

  .card { background: var(--blanco); border-radius: 18px; padding: 18px 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .card.hero { background: var(--tinta); color: #fff; }
  .etq { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); font-weight: 700; }

  .num { font-size: 38px; font-weight: 800; color: var(--naranja); line-height: 1.15; margin: 4px 0 2px; }

  h1 { font-size: 26px; line-height: 1.15; font-weight: 800; margin: 6px 0 14px; }

  .btn.hecho { background: var(--tinta); }

  .dias a.ok { background: var(--tinta); color: #fff; border-color: var(--tinta); }
  .dias a.hoy { border: 2px solid var(--naranja); color: var(--naranja); }
  .aviso { background: var(--naranja-claro); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }

  /* Calculadoras */
  .campo { margin-bottom: 10px; }
  .campo label { display: block; font-size: 13px; font-weight: 700; color: var(--suave); margin-bottom: 4px; }

  .bar span.b { height: 14px; border-radius: 99px; background: var(--naranja); min-width: 2px; }
  .bar span.b.alivio { background: var(--tinta); }
  .bar em { font-style: normal; text-align: right; font-weight: 700; }
  .sem { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .nota { font-size: 13px; color: var(--suave); margin-top: 8px; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
  .tabs a { text-align: center; padding: 9px 4px; border-radius: 12px; font-weight: 800; font-size: 13px; background: var(--blanco); border: 1px solid #ddd; }
  .tabs a.on { background: var(--tinta); color: #fff; border-color: var(--tinta); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 14px 18px; border-radius: 14px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: 92%; text-align: center; z-index: 9; }
  .cert { text-align: center; padding: 36px 20px; border: 3px solid var(--tinta); }
  .cert .num { font-size: 30px; }
  .pie { text-align: center; margin-top: 28px; font-size: 13px; color: var(--suave); }
  .pie button { text-decoration: underline; font-size: 13px; color: var(--suave); }
  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .card { box-shadow: none; }
  }

  .dias { grid-template-columns: repeat(6, 1fr); }
  .estado { font-size: 13px; font-weight: 700; }
</style>
</head>

<script>
// Calculadoras de "30 días para ahorrar" (upsell de Plata en Orden).
// Solo cuentas: no guardan nada ni tocan la pantalla. Montos en pesos, redondeados al peso.
(function (raiz) {
  'use strict';

  function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
  const HITOS = [0.25, 0.5, 0.75, 1];

  // Día 1 y 29. Meta: { nombre, monto, meses, guardado }. Cuánto apartar por mes para llegar.
  function planMeta(m) {
    const monto = num(m.monto), guardado = num(m.guardado), meses = Math.max(1, num(m.meses) || 1);
    const falta = Math.max(0, monto - guardado);
    return {
      monto: Math.round(monto), guardado: Math.round(guardado), falta: Math.round(falta),
      porMes: Math.ceil(falta / meses),
      avance: monto > 0 ? Math.min(1, guardado / monto) : 0,
      hitos: HITOS.filter(h => monto > 0 && guardado >= monto * h), // día 27: un gusto en cada 25%
    };
  }

  // Día 9 y 25. Cuánto es un porcentaje de lo que cobrás.
  function porcentaje(cobro, pct) { return Math.round(num(cobro) * num(pct) / 100); }

  // Día 9. Tabla para comparar porcentajes.
  function tablaPorcentajes(cobro, opciones) {
    return (opciones || [3, 5, 10]).map(p => ({ pct: p, porMes: porcentaje(cobro, p), porAnio: porcentaje(cobro, p) * 12 }));
  }

  // Día 12. La mitad del aumento va a la meta.
  function mitadDelAumento(aumento) {
    const a = Math.round(num(aumento));
    const meta = Math.round(a / 2);
    return { aMeta: meta, paraVos: a - meta };
  }

  // Día 4. Redondeo al millar de arriba: [montos] -> diferencia total.
  function redondeo(gastos, a) {
    const paso = num(a) || 1000;
    return (gastos || []).reduce((t, g) => {
      const x = num(g);
      return t + (x > 0 ? Math.ceil(x / paso) * paso - x : 0);
    }, 0);
  }

  // Días 19 y 26. Gastos del año (cumpleaños, meses caros): total y cuánto apartar por mes.
  function apartadoMensual(lista) {
    const total = Math.round((lista || []).reduce((t, x) => t + num(x.monto), 0));
    return { total, porMes: Math.ceil(total / 12) };
  }

  // Día 13. Compras en espera: { que, desde (ISO) }. Listas para decidir después de 48 horas.
  function esperaLista(item, ahora) {

    return t - new Date(item.desde).getTime() >= 48 * 3600 * 1000;
  }

  // Contador de los 30 días: registros { monto }.
  function totalAhorrado(registros) {
    return Math.round((registros || []).reduce((t, r) => t + num(r.monto), 0));
  }

  const api = { planMeta, porcentaje, tablaPorcentajes, mitadDelAumento, redondeo, apartadoMensual, esperaLista, totalAhorrado };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else raiz.Ahorro = api;
})(typeof window !== 'undefined' ? window : this);

</script>

  }

  function pantallaContador() {
    return `<h1>Contador</h1>
      <div class="card hero"><div class="etq">Ahorrado en estos 30 días</div><div class="num" id="res-total"></div></div>
      <div class="card"><p class="sub">Cada cosa que ahorres: una venta, el redondeo, la heladera, una baja.</p>
        ${lista('registros', [{ k: 'motivo', tipo: 'txt', ph: 'Vendí el cochecito' }, { k: 'monto', titulo: 'Monto', ph: '50.000' }], 'ahorro')}</div>`;
  }
  function resContador() { const el = document.getElementById('res-total'); if (el) el.textContent = plata(A.totalAhorrado(E.registros)); }

  function pantallaHerramientas() {
    return `<h1>Herramientas</h1>
      <div class="card"><h2>¿Qué porcentaje ahorrar? <span class="sub">(días 9 y 25)</span></h2>
        <div class="dos">${campo('cobro', 'Lo que cobrás por mes', '900.000')}${campo('pctPropio', 'Tu porcentaje', '5')}</div><div id="res-pct"></div></div>
      <div class="card"><h2>El aumento que no se gasta <span class="sub">(día 12)</span></h2>
        ${campo('aumento', 'De cuánto fue tu aumento', '60.000')}<div id="res-aumento"></div></div>
      <div class="card"><h2>El vuelto que no ves <span class="sub">(día 4)</span></h2>
        <p class="sub">Cargá lo que gastaste hoy. La app redondea al millar de arriba.</p>
        ${lista('redondeo', [{ k: 'monto', ph: '7.300' }], 'gasto')}<div id="res-redondeo"></div></div>
      <div class="card"><h2>La regla de las 48 horas <span class="sub">(día 13)</span></h2>
        ${lista('espera', [{ k: 'que', tipo: 'txt', ph: 'Zapatillas' }], 'compra en espera', (f) => `<p class="estado" data-espera="${esc(f.desde)}"></p>`)}</div>
      <div class="card"><h2>Regalos con tope <span class="sub">(día 19)</span></h2>
        ${lista('cumples', [{ k: 'nombre', tipo: 'txt', ph: 'Cumple de mamá' }, { k: 'monto', titulo: 'Regalo', ph: '30.000' }], 'cumpleaños')}<div id="res-cumples"></div></div>
      <div class="card"><h2>El mes caro <span class="sub">(día 26)</span></h2>
        ${lista('mesesCaros', [{ k: 'nombre', tipo: 'txt', ph: 'Marzo: útiles y matrícula' }, { k: 'monto', titulo: 'Gasto de más', ph: '150.000' }], 'mes caro')}<div id="res-caros"></div></div>`;
  }
  function resHerramientas() {
    const set = (id, h) => { const el = document.getElementById(id); if (el) el.innerHTML = h; };
    const t = A.tablaPorcentajes(E.cobro);
    set('res-pct', E.cobro > 0 ? lineas(t.map(x => [`El ${x.pct}%`, `${plata(x.porMes)} por mes · ${plata(x.porAnio)} al año`]).concat(E.pctPropio > 0 ? [[`Tu ${E.pctPropio}%`, plata(A.porcentaje(E.cobro, E.pctPropio)) + ' por mes', 'total']] : [])) : '<p class="nota">Cargá lo que cobrás para comparar.</p>');
    const m = A.mitadDelAumento(E.aumento);
    set('res-aumento', E.aumento > 0 ? lineas([['A tu meta', plata(m.aMeta), 'total'], ['Para vos, sin culpa', plata(m.paraVos)]]) : '');
    set('res-redondeo', lineas([['Para pasar a tu meta', plata(A.redondeo(E.redondeo.map(x => x.monto))), 'total']]));
    document.querySelectorAll('[data-espera]').forEach(el => {
      const h = Math.max(0, 48 - (Date.now() - new Date(el.dataset.espera).getTime()) / 3600000);
      el.innerHTML = h === 0 ? '<span class="pos">Ya pasaron las 48 horas: ¿la seguís queriendo?</span>' : `<span class="sub">Faltan ${Math.ceil(h)} horas para decidir.</span>`;
    });
    const c = A.apartadoMensual(E.cumples);
    set('res-cumples', lineas([['Total del año', plata(c.total)], ['Apartá por mes', plata(c.porMes), 'total']]));
    const k = A.apartadoMensual(E.mesesCaros);
    set('res-caros', lineas([['Total de los meses caros', plata(k.total)], ['Apartá por mes', plata(k.porMes), 'total']]));
  }

  function vistaHerr(nombre) {
    const v = { metas: [pantallaMetas, resMetas], contador: [pantallaContador, resContador], herramientas: [pantallaHerramientas, resHerramientas] }[nombre];
    if (!v) { location.hash = '#/inicio'; return; }
    app.innerHTML = cabecera(`<a class="volver" href="#/inicio">← Inicio</a>`) + tabs(nombre) + v[0]();
    resultados = v[1]; resultados();
  }

  // ---------- Navegación ----------
  function render() {
    resultados = null;
    const h = location.hash.replace(/^#\/?/, '').split('/');
    if (h[0] === 'dia') vistaDia(parseInt(h[1], 10));
    else if (h[0] === 'h') vistaHerr(h[1]);
    else vistaInicio();
    window.scrollTo(0, 0);
  }
  function redibujar() { const y = window.scrollY; render(); window.scrollTo(0, y); }
  function toast(t) {
    document.querySelectorAll('.toast').forEach(x => x.remove());
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
    document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
  }

  app.addEventListener('input', e => {
    const el = e.target; const ruta = el.dataset.path; if (!ruta) return;
    escribir(ruta, el.dataset.tipo === 'num' ? aNumero(el.value) : el.value);
    guardar(); if (resultados) resultados();
  });
  app.addEventListener('change', e => { const el = e.target; if (el.dataset.tipo === 'num' && el.value) el.value = verNum(aNumero(el.value)); });
  let borrarArmado = false;
  app.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.agregar) { E[b.dataset.agregar].push(NUEVAS[b.dataset.agregar]()); guardar(); redibujar(); return; }
    if (b.dataset.quitar) { const p = b.dataset.quitar.split('.'); E[p[0]].splice(Number(p[1]), 1); guardar(); redibujar(); return; }
    const a = b.dataset.accion;
    if (a === 'hecho') {
      const n = Number(b.dataset.dia);
      if (E.hechos[n]) delete E.hechos[n];
      else { E.hechos[n] = new Date().toISOString(); const d = CONTENIDO.dias[n - 1]; toast(d.medalla ? '🏅 Medalla: ' + d.medalla : '✓ Día ' + n + ' hecho'); }
      guardar();
      if (E.hechos[n] && n < TOTAL) location.hash = '#/inicio'; else render();
    } else if (a === 'anotar') {
      const inp = document.getElementById('rapido'); const monto = aNumero(inp.value);
      if (monto > 0) {
        const n = Number(b.dataset.dia);
        E.registros.push({ motivo: 'Día ' + n + ': ' + CONTENIDO.dias[n - 1].titulo, monto });
        guardar(); inp.value = ''; toast('Sumado: ' + plata(monto) + '. Total: ' + plata(A.totalAhorrado(E.registros)));
      }
    } else if (a === 'borrar') {
      if (!borrarArmado) { borrarArmado = true; b.textContent = 'Tocá de nuevo para borrar todo'; setTimeout(() => { borrarArmado = false; b.textContent = 'Borrar mis datos'; }, 4000); return; }
      E = inicial(); guardar(); borrarArmado = false; render(); toast('Listo, empezás de cero');
    }
  });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
